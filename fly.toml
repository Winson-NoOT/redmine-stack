app = 'winson-noot-redmine'
primary_region = 'sin'

[build]

[env]
  RAILS_ENV = "production"

[deploy]
  release_command = "bundle exec rake db:migrate redmine:plugins:migrate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'redmine_files'
  destination = '/usr/src/redmine/files'
